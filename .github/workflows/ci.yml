# Verifies every push to main and every pull request.
#
# This is also the gate the Dependabot auto-merge job waits on
# (.github/workflows/dependabot-auto-merge.yml `needs: verify`), so a bad
# dependency bump is caught here rather than on production. PR #17 — the
# TypeScript 7 bump that broke `npm install` — is exactly the case this
# catches: it only surfaced via a failed Vercel preview before.
#
# Actions are pinned to commit SHAs, not tags, so a compromised or force-moved
# tag cannot change what runs here. .github/dependabot.yml keeps them current
# on a monthly schedule.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Not node-version-file: engines.node here is a RANGE (">=22.12.0"),
          # which setup-node cannot resolve to a concrete release.
          node-version: 22
          cache: npm

      # `npm ci` fails on a lockfile that disagrees with package.json — which
      # is the point. It is what would have rejected the TypeScript 7 bump.
      - run: npm ci

      - name: Build
        run: npm run build

      # `npm run check` is astro check + npm audit. Kept out of `npm run build`
      # on purpose: an advisory published overnight must never block a
      # production deploy of unrelated work. Here, on a PR, it should block.
      - name: Typecheck and audit
        run: npm run check

      # The ten blog posts are generated by a codemod that must be idempotent.
      # If someone hand-edits a post instead of editing the codemod, this fails.
      - name: Blog codemod is idempotent and applied
        run: |
          node tools/build-blog-posts.mjs
          if ! git diff --quiet -- src/pages/blog; then
            echo "::error::tools/build-blog-posts.mjs produced changes — run it and commit the result"
            git diff --stat -- src/pages/blog
            exit 1
          fi

      - name: Build output sanity
        run: |
          pages=$(find dist -name index.html | wc -l | tr -d ' ')
          [ "$pages" = "19" ] || { echo "::error::expected 19 pages, built $pages"; exit 1; }
          grep -q "tel:+61433092621" dist/index.html || { echo "::error::homepage lost its tel: link"; exit 1; }
          echo "$pages pages built"
